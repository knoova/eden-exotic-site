# =============================================================================
# Eden Exotic — stack applicativo
# Il database (Postgres 18 + pgvector) e, se vuoi, Ollama sono forniti da te:
# l'app si configura con UN SOLO URL (DATABASE_URL) + OLLAMA_URL.
# Il database vettoriale del RAG vive dentro Postgres (pgvector): niente Qdrant.
# =============================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # UN SOLO URL per il database (Postgres 18 + estensione pgvector)
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-768}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-eden47}
      ADMIN_SECRET: ${ADMIN_SECRET:-cambia_questo_segreto}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    # se abiliti il servizio ollama qui sotto:
    # depends_on: [ollama]

